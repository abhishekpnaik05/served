{% extends 'delivery/base.html' %}
{% block title %}Update Restaurant - FinalMealmate{% endblock %}
{% block navbar %}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Update Restaurant</h1>
            <p>Edit restaurant details</p>
        </div>
        <form action="{% url 'update_restaurant' restaurant.id %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Restaurant Name</label>
                <input type="text" id="name" name="name" value="{{restaurant.name}}" required>
            </div>
            <div class="form-group">
                <label for="picture">Picture URL</label>
                <input type="url" id="picture" name="picture" value="{{restaurant.picture}}">
            </div>
            <div class="form-group">
                <label for="cuisine">Cuisine Type</label>
                <input type="text" id="cuisine" name="cuisine" value="{{restaurant.cuisine}}" required>
            </div>
            <div class="form-group">
                <label for="rating">Rating (0-5)</label>
                <input type="number" id="rating" name="rating" min="0" max="5" step="0.5" value="{{restaurant.rating}}" required>
            </div>
            <button type="submit" class="auth-btn">Update Restaurant</button>
        </form>
        <div class="auth-footer">
            <a href="{% url 'open_show_restaurant' %}">← Back to Restaurants</a>
        </div>
    </div>
</div>
{% endblock %}
