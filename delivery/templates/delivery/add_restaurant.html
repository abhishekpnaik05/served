{% extends 'delivery/base.html' %}
{% block title %}Add Restaurant - FinalMealmate{% endblock %}
{% block navbar %}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Add New Restaurant</h1>
            <p>Enter restaurant details</p>
        </div>
        <form action="{% url 'add_restaurant' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Restaurant Name</label>
                <input type="text" id="name" name="name" placeholder="Enter restaurant name" required>
            </div>
            <div class="form-group">
                <label for="picture">Picture URL</label>
                <input type="url" id="picture" name="picture" placeholder="Enter image URL">
            </div>
            <div class="form-group">
                <label for="cuisine">Cuisine Type</label>
                <input type="text" id="cuisine" name="cuisine" placeholder="e.g., Indian, Chinese, Italian" required>
            </div>
            <div class="form-group">
                <label for="rating">Rating (0-5)</label>
                <input type="number" id="rating" name="rating" min="0" max="5" step="0.5" placeholder="4.5" required>
            </div>
            <button type="submit" class="auth-btn">Add Restaurant</button>
        </form>
        <div class="auth-footer">
            <a href="{% url 'open_show_restaurant' %}">← Back to Restaurants</a>
        </div>
    </div>
</div>
{% endblock %}
