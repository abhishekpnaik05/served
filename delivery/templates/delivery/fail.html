{% extends 'delivery/base.html' %}
{% block title %}Login Failed - FinalMealmate{% endblock %}
{% block navbar %}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="text-center">
            <h1 style="font-size: 3rem;">❌</h1>
            <h1 class="section-title">Login Failed</h1>
            <p class="mb-2">Invalid username or password. Please try again.</p>
            <div class="d-flex gap-2 justify-center">
                <a href="{% url 'open_signin' %}" class="btn btn-orange">Try Again</a>
                <a href="{% url 'open_signup' %}" class="btn btn-secondary">Create Account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
